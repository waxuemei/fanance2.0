        .tag-out { color: #2563eb; font-weight: bold; background: #dbeafe; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px;}

    // ==================== 鐢ㄦ埛璁よ瘉 ====================
    async function employeeRegister() {
        const name = document.getElementById('empRegName').value.trim();
        const pwd = document.getElementById('empRegPwd').value;

        if (!name || !pwd) { alert('璇峰～鍐欏畬鏁翠俊鎭?); return; }

        try {
            let existing = null;
            try {
                const query = new AV.Query('Employee');
                query.equalTo('name', name);
                existing = await query.first();
            } catch (queryError) {
                if (queryError.code !== 101) throw queryError;
            }

            if (existing) { alert('璇ュ鍚嶅凡娉ㄥ唽'); return; }

            const Employee = AV.Object.extend('Employee');
            const emp = new Employee();
            emp.set('name', name);
            emp.set('password', pwd);
            emp.set('status', 'pending');
            await emp.save();

            alert('娉ㄥ唽鎴愬姛锛佽绛夊緟鑰佹澘瀹℃牳');
            switchEmpTab('login');
            document.getElementById('empRegName').value = '';
            document.getElementById('empRegPwd').value = '';
        } catch (e) {
            console.error(e);
            alert('娉ㄥ唽澶辫触: ' + e.message);
        }
    }

    // ==================== 鏁版嵁鍔犺浇 ====================
    async function loadInventory() {
        try {
            const query = new AV.Query('Inventory');
            query.limit(1000);
            const results = await query.find();

            inventoryCache = results.map(r => ({
                id: r.id,
                brand: r.get('brand'),
                spec: r.get('spec'),
                quantity: r.get('quantity') || 0,
                avgCost: r.get('avgCost') || 0
            }));

            renderInventoryTable();
        } catch (e) {
            if (e.code === 101) {
                console.log('Inventory绫诲皻涓嶅瓨鍦紝灏嗗湪棣栨鍏ュ簱鏃跺垱寤?);
                inventoryCache = [];
                renderInventoryTable();
            } else {
                console.error(e);
            }
        }
    }

    function renderInventoryTable() {
        const search = (document.getElementById('invSearch')?.value || '').toLowerCase();
        const filtered = inventoryCache.filter(i =>
            !search || i.brand.toLowerCase().includes(search) || i.spec.toLowerCase().includes(search)
        );

        const tbody = document.getElementById('invTableBody');
        const empty = document.getElementById('invEmpty');

        if (filtered.length === 0) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            tbody.innerHTML = filtered.map(i => `
                <tr onclick="showEditInventoryModal('${i.id}')" class="cursor-pointer hover:bg-slate-50">
                    <td class="p-3"><div class="font-bold">${i.brand}</div><div class="text-xs text-slate-500">${i.spec}</div></td>
                    <td class="p-3 text-right font-bold ${i.quantity < 4 ? 'text-red-500' : ''}">${i.quantity}</td>
                    <td class="p-3 text-right text-slate-500">楼${(i.avgCost || 0).toFixed(0)}</td>
                </tr>
            `).join('');
        }

        const totalQty = filtered.reduce((s, i) => s + (i.quantity || 0), 0);
        const totalValue = filtered.reduce((s, i) => s + ((i.quantity || 0) * (i.avgCost || 0)), 0);
        document.getElementById('invTotalQty').textContent = totalQty;
        document.getElementById('invTotalValue').textContent = '楼' + totalValue.toLocaleString();
    }

    function filterInventory() {
        renderInventoryTable();
    }

    async function loadTransactions() {
        try {
            const query = new AV.Query('Transaction');
            query.descending('createdAt');
            // 澧炲姞闄愬埗浠ラ€傚簲鏈堟姤鏁版嵁閲?
            query.limit(2000); 
            const results = await query.find();

            transactionsCache = results.map(r => ({
                id: r.id,
                type: r.get('type'),
                brand: r.get('brand'),
                spec: r.get('spec'),
                serviceName: r.get('serviceName'),
                serviceDesc: r.get('serviceDesc'),
                quantity: r.get('quantity'),
                price: r.get('price'),
                totalPrice: r.get('totalPrice'),
                totalCost: r.get('totalCost'),
                profit: r.get('profit'),
                operator: r.get('operator'),
                inventoryId: r.get('inventoryId'),
                costAtTime: r.get('costAtTime'),
                date: r.createdAt
            }));
        } catch (e) {
            if (e.code === 101) {
                transactionsCache = [];
            } else {
                console.error(e);
            }
        }
    }

    function renderTxItem(t, showProfit, canEdit = false) {
        const typeColors = {
            'stock_in': 'bg-purple-100 text-purple-600',
            'sale': 'bg-blue-100 text-blue-600',
            'service': 'bg-emerald-100 text-emerald-600',
            'other': 'bg-orange-100 text-orange-600'
        };
        const typeIcons = {
            'stock_in': '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>',
            'sale': '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>',
            'service': '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>',
            'other': '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>'
        };

        let title, detail;
        if (t.type === 'stock_in') {
            title = `杩涜揣: ${t.brand}`;
            detail = t.spec ? `${t.spec} ` : '';
        } else if (t.type === 'sale') {
            title = `閿€鍞? ${t.brand}`;
            detail = t.spec ? `${t.spec} ` : '';
        } else if (t.type === 'other') {
            title = t.serviceName;
            detail = t.serviceDesc ? `${t.serviceDesc} ` : '';
        } else {
            title = t.serviceName;
            detail = '';
        }
        const time = new Date(t.date).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        const clickHandler = canEdit ? `onclick="showEditTxModal('${t.id}')"` : '';
        const cursorClass = canEdit ? 'cursor-pointer hover:bg-slate-50' : '';
        const qtyDisplay = (t.type === 'other' || t.type === 'service') ? '' : `x${t.quantity} 路 `;

        return `
            <div class="record-item flex justify-between items-center ${cursorClass}" ${clickHandler}>
                <div class="flex gap-3 items-center flex-1 min-w-0">
                    <div class="p-2 rounded-lg ${typeColors[t.type] || 'bg-slate-100 text-slate-600'}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${typeIcons[t.type] || typeIcons['service']}</svg></div>
                    <div class="min-w-0"><div class="font-bold text-sm truncate">${title}</div><div class="text-xs text-slate-500">${detail}${qtyDisplay}${time} 路 ${t.operator}</div></div>
                </div>
                <div class="text-right flex items-center gap-2">
                    <div>
                        <div class="font-bold">楼${t.type === 'stock_in' ? t.totalCost : t.totalPrice}</div>
                        ${showProfit && t.profit ? `<div class="text-xs text-emerald-600">璧?楼${t.profit.toFixed(0)}</div>` : ''}
                    </div>
                    ${canEdit ? `<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>` : ''}
                </div>
            </div>
        `;
    }

    async function submitSale() {

        if (!id || !qty || !price) { alert('璇峰～鍐欏畬鏁翠俊鎭?); return; }

    async function submitStockIn() {
        const brand = document.getElementById('stockBrand').value.trim();
        const spec = document.getElementById('stockSpec').value.trim();
        const qty = parseInt(document.getElementById('stockQty').value);
        const cost = parseFloat(document.getElementById('stockCost').value);

        if (!brand || !spec || !qty || !cost) { alert('璇峰～鍐欏畬鏁翠俊鎭?); return; }

        try {
            let inv = null;
            try {
                const query = new AV.Query('Inventory');
                query.equalTo('brand', brand);
                query.equalTo('spec', spec);
                inv = await query.first();
            } catch (queryError) {
                console.log('Inventory绫诲皻涓嶅瓨鍦紝灏嗗垱寤烘柊璁板綍');
            }

            if (inv) {
                const currQty = inv.get('quantity') || 0;
                const currAvg = inv.get('avgCost') || 0;
                const newQty = currQty + qty;
                const newAvg = ((currQty * currAvg) + (qty * cost)) / newQty;

                inv.set('quantity', newQty);
                inv.set('avgCost', newAvg);
            } else {
                const Inventory = AV.Object.extend('Inventory');
                inv = new Inventory();
                inv.set('brand', brand);
                inv.set('spec', spec);
                inv.set('quantity', qty);
                inv.set('avgCost', cost);
            }
            await inv.save();

            const Transaction = AV.Object.extend('Transaction');
            const tx = new Transaction();
            tx.set('type', 'stock_in');
            tx.set('brand', brand);
            tx.set('spec', spec);
            tx.set('quantity', qty);
            tx.set('totalCost', qty * cost);
            tx.set('operator', currentUser.name);
            await tx.save();

            alert(`鎴愬姛鍏ュ簱 ${qty} 鏉);
            hideStockInModal();
            showSyncIndicator();
            loadInventory();
        } catch (e) {
            console.error(e);
            alert('鍏ュ簱澶辫触: ' + e.message);
        }
    }

        editingTx = tx;
        document.getElementById('editTxId').value = id;
        document.getElementById('editTxType').value = tx.type;

        if (tx.type === 'sale' || tx.type === 'stock_in') {
            document.getElementById('editTxSaleFields').style.display = 'block';
            document.getElementById('editTxServiceFields').style.display = 'none';
            document.getElementById('editTxBrand').value = tx.brand || '';
            document.getElementById('editTxSpec').value = tx.spec || '';
            document.getElementById('editTxPriceLabel').textContent = tx.type === 'stock_in' ? '杩涜揣鍗曚环' : '閿€鍞崟浠?;
        } else {
            document.getElementById('editTxSaleFields').style.display = 'none';
            document.getElementById('editTxServiceFields').style.display = 'block';
            document.getElementById('editTxServiceName').value = tx.serviceName || '';
            document.getElementById('editTxPriceLabel').textContent = '鎬讳环';
        }

        document.getElementById('editTxQty').value = tx.quantity;
        document.getElementById('editTxPrice').value = tx.type === 'service' ? tx.totalPrice : tx.price;
        updateEditTxTotal();

        document.getElementById('editTxQty').oninput = updateEditTxTotal;
        document.getElementById('editTxPrice').oninput = updateEditTxTotal;

        document.getElementById('editTxModal').style.display = 'flex';
    }

    function hideEditTxModal() {
        document.getElementById('editTxModal').style.display = 'none';
        editingTx = null;
    }

    function updateEditTxTotal() {
        const qty = parseFloat(document.getElementById('editTxQty').value) || 0;
        const price = parseFloat(document.getElementById('editTxPrice').value) || 0;
        const type = document.getElementById('editTxType').value;

        let total;
        if (type === 'service') {
            total = price; 
        } else {
            total = qty * price;
        }
        document.getElementById('editTxTotal').textContent = '楼' + total.toFixed(0);
    }

    async function saveEditTx() {
        const id = document.getElementById('editTxId').value;
        const type = document.getElementById('editTxType').value;
        const qty = parseInt(document.getElementById('editTxQty').value);
        const price = parseFloat(document.getElementById('editTxPrice').value);

        if (!qty || !price) {
            alert('璇峰～鍐欏畬鏁翠俊鎭?);
            return;
        }

        try {
            const tx = AV.Object.createWithoutData('Transaction', id);
            tx.set('quantity', qty);

            if (type === 'service') {
                tx.set('totalPrice', price);
                tx.set('profit', price);
            } else if (type === 'sale') {
                tx.set('price', price);
                tx.set('totalPrice', qty * price);
                const costAtTime = editingTx.costAtTime || 0;
                tx.set('profit', (price - costAtTime) * qty);
            } else if (type === 'stock_in') {
                tx.set('totalCost', qty * price);
            }

            await tx.save();

            if (type === 'sale' && editingTx.inventoryId) {
                const qtyDiff = qty - editingTx.quantity;
                if (qtyDiff !== 0) {
                    const invItem = inventoryCache.find(i => i.id === editingTx.inventoryId);
                    if (invItem) {
                        const inv = AV.Object.createWithoutData('Inventory', editingTx.inventoryId);
                        inv.set('quantity', invItem.quantity - qtyDiff);
                        await inv.save();
                    }
                }
            }

            alert('淇敼鎴愬姛锛?);
            hideEditTxModal();
            showSyncIndicator();

            if (currentUser.role === 'boss') {
                loadBossDashboard();
            } else {
                loadEmpDashboard();
            }
        } catch (e) {
            console.error(e);
            alert('淇敼澶辫触: ' + e.message);
        }
    }

    async function deleteTx() {
        if (!confirm('纭畾瑕佸垹闄よ繖鏉¤褰曞悧锛熸鎿嶄綔涓嶅彲鎾ら攢锛?)) return;

        const id = document.getElementById('editTxId').value;
        const type = document.getElementById('editTxType').value;

        try {
            if (type === 'sale' && editingTx && editingTx.inventoryId) {
                const invItem = inventoryCache.find(i => i.id === editingTx.inventoryId);
                if (invItem) {
                    const inv = AV.Object.createWithoutData('Inventory', editingTx.inventoryId);
                    inv.set('quantity', invItem.quantity + editingTx.quantity);
                    await inv.save();
                }
            }

            const tx = AV.Object.createWithoutData('Transaction', id);
            await tx.destroy();

            alert('鍒犻櫎鎴愬姛锛?);
            hideEditTxModal();
            showSyncIndicator();

            if (currentUser.role === 'boss') {
                loadBossDashboard();
            } else {
                loadEmpDashboard();
            }
        } catch (e) {
            console.error(e);
            alert('鍒犻櫎澶辫触: ' + e.message);
        }
    }

    async function renderInventoryLog() {
        if (transactionsCache.length === 0) await loadTransactions();

        // 绛涢€?鍏ュ簱 鍜?閿€鍞?璁板綍
        const logs = transactionsCache.filter(t => t.type === 'stock_in' || t.type === 'sale');
        
        const container = document.getElementById('inventoryLogList');
        if (logs.length === 0) {
            container.innerHTML = '<div class="text-center text-slate-400 py-8">鏆傛棤鍑哄叆搴撹褰?/div>';
            return;
        }

        container.innerHTML = logs.map(t => {
            const date = new Date(t.date);
            // 鏍煎紡: 2026.2.2
            const dateStr = `${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()}`;
            
            let actionHtml = '';
            if (t.type === 'stock_in') {
                actionHtml = `<span class="tag-in">澧炲姞</span> ${t.brand} ${t.spec} x${t.quantity}`;
            } else {
                // 閿€鍞嵆涓轰娇鐢?
                actionHtml = `<span class="tag-out">浣跨敤</span> ${t.brand} ${t.spec} x${t.quantity}`;
            }

            return `
                <div class="log-item">
                    <div class="log-date">${dateStr}</div>
                    <div class="log-content">${actionHtml}</div>
                </div>
            `;
        }).join('');
    }

    // ==================== 鎶ヨ〃鍔熻兘 (鍗囩骇锛氭敮鎸佹湀鎶? ====================
    function setBossReportToday() {
        if (reportType === 'day') {
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('bossReportDate').value = today;
        } else {
            const todayMonth = new Date().toISOString().slice(0, 7);
            document.getElementById('bossReportDate').value = todayMonth;
        }
        loadBossReport();
    }

    function switchReportType(type) {
        reportType = type;
        const btnDay = document.getElementById('reportTypeDay');
        const btnMonth = document.getElementById('reportTypeMonth');
        const input = document.getElementById('bossReportDate');
        const label = document.getElementById('reportDateLabel');

        if (type === 'day') {
            btnDay.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow text-blue-600 transition-all';
            btnDay.style.color = '#2563eb';
            btnMonth.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg text-slate-500 transition-all';
            input.type = 'date';
            label.textContent = '閫夋嫨鏃ユ湡';
        } else {
            btnMonth.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow text-blue-600 transition-all';
            btnMonth.style.color = '#2563eb';
            btnDay.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg text-slate-500 transition-all';
            input.type = 'month'; // 鍒囨崲涓烘湀浠介€夋嫨鍣?
            label.textContent = '閫夋嫨鏈堜唤';
        }
        setBossReportToday();
    }

    async function loadBossReport() {
        await loadTransactions();

        const dateStr = document.getElementById('bossReportDate').value;
        if (!dateStr) return;

        let filteredTx = [];

        if (reportType === 'day') {
            // 鏃ユ姤妯″紡锛氬尮閰?YYYY-MM-DD
            filteredTx = transactionsCache.filter(t => {
                const txDate = new Date(t.date).toISOString().slice(0, 10);
                return txDate === dateStr && (t.type === 'sale' || t.type === 'service' || t.type === 'other');
            });
        } else {
            // 鏈堟姤妯″紡锛氬尮閰?YYYY-MM
            filteredTx = transactionsCache.filter(t => {
                const txMonth = new Date(t.date).toISOString().slice(0, 7);
                return txMonth === dateStr && (t.type === 'sale' || t.type === 'service' || t.type === 'other');
            });
        }

        const revenue = filteredTx.reduce((s, t) => s + (t.totalPrice || 0), 0);
        const profit = filteredTx.reduce((s, t) => s + (t.profit || 0), 0);
        const orders = filteredTx.length;

        document.getElementById('reportRevenue').textContent = '楼' + revenue;
        document.getElementById('reportProfit').textContent = '楼' + profit.toFixed(0);
        document.getElementById('reportOrders').textContent = orders;

        const byEmployee = {};
        filteredTx.forEach(t => {
            const emp = t.operator || '鏈煡';
            if (!byEmployee[emp]) {
                byEmployee[emp] = { revenue: 0, profit: 0, orders: 0 };
            }
            byEmployee[emp].revenue += t.totalPrice || 0;
            byEmployee[emp].profit += t.profit || 0;
            byEmployee[emp].orders += 1;
        });

        const empList = Object.entries(byEmployee).sort((a,b) => b[1].revenue - a[1].revenue); // 鎸夎惀涓氶鎺掑簭
        if (empList.length === 0) {
            document.getElementById('reportByEmployee').innerHTML = '<div class="text-slate-400 text-center py-4">鏆傛棤鏁版嵁</div>';
        } else {
            document.getElementById('reportByEmployee').innerHTML = empList.map(([name, data]) => `
                <div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-0">
                    <div>
                        <div class="font-bold">${name}</div>
                        <div class="text-xs text-slate-500">${data.orders} 鍗?/div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-blue-600">楼${data.revenue}</div>
                        <div class="text-xs text-emerald-600">鍒╂鼎 楼${data.profit.toFixed(0)}</div>
                    </div>
                </div>
            `).join('');
        }

        if (filteredTx.length === 0) {
            document.getElementById('reportRecords').innerHTML = '<div class="text-center py-8 text-slate-400">璇ユ椂娈垫殏鏃犺褰?/div>';
        } else {
            document.getElementById('reportRecords').innerHTML = filteredTx.map(t => renderTxItem(t, true, false)).join('');
        }
    }

    async function loadEmpReport() {
        await loadTransactions();

        const dateStr = document.getElementById('empReportDate').value;
        if (!dateStr) return;

        const dayTx = transactionsCache.filter(t => {
            const txDate = new Date(t.date).toISOString().slice(0, 10);
            return txDate === dateStr &&
                   t.operator === currentUser.name &&
                   (t.type === 'sale' || t.type === 'service' || t.type === 'other');
        });

        const revenue = dayTx.reduce((s, t) => s + (t.totalPrice || 0), 0);
        const orders = dayTx.length;

        document.getElementById('empReportRevenue').textContent = '楼' + revenue;
        document.getElementById('empReportOrders').textContent = orders;

        if (dayTx.length === 0) {
            document.getElementById('empReportRecords').innerHTML = '<div class="text-center py-8 text-slate-400">璇ユ棩鏈熸殏鏃犺褰?/div>';
        } else {
            document.getElementById('empReportRecords').innerHTML = dayTx.map(t => renderTxItem(t, false, false)).join('');
        }
    }
